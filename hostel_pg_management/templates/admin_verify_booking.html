{% extends 'base.html' %}
{% block title %}Verify Booking | HostelApp{% endblock %}
{% block header %}Verify Booking{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm border-0 mt-4 glass-card">
      <div class="card-body p-4">
        <form method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label">Booking ID</label>
            <input type="text" name="booking_id" class="form-control" placeholder="Enter Booking ID">
          </div>
          <div class="mb-3">
            <label class="form-label">Email ID</label>
            <input type="email" name="email" class="form-control" placeholder="Enter email used for booking">
          </div>
          <div class="text-end">
            <button class="btn btn-primary">Verify Booking</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
