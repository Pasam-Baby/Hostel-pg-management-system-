{% extends 'base.html' %}
{% block title %}Facilities | HostelApp{% endblock %}
{% block header %}Facilities{% endblock %}
{% block content %}
<div class="card shadow-sm border-0 glass-card">
    <div class="card-body">
        <h5 class="fw-bold mb-3">Facilities</h5>
        <div class="list-group">
            {% for f in facilities %}
            <div class="list-group-item">
                <div class="d-flex w-100 justify-content-between">
                    <h6 class="mb-1 fw-bold">{{ f.name }}</h6>
                </div>
                {% if f.description %}
                <p class="mb-1 text-muted">{{ f.description }}</p>
                {% endif %}
            </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
