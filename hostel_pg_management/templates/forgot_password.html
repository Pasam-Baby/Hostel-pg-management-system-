{% extends 'base.html' %}
{% block title %}Forgot Password | HostelApp{% endblock %}
{% block header %}Reset Password{% endblock %}
{% block content %}
<div class="bg-dashboard min-vh-100 d-flex flex-column justify-content-center" style="margin: -1.5rem;">
    <div class="login-container mt-0 mb-5">
        <div class="card shadow-lg border-0 rounded-4 glass-card float-animation">
            <div class="card-body p-5">
            <div class="text-center mb-4">
                <div class="bg-warning bg-opacity-10 rounded-circle d-inline-block p-4 mb-3">
                    <i class="bi bi-envelope text-warning" style="font-size: 3rem;"></i>
                </div>
                <h3 class="fw-bold">Forgot Password</h3>
                <p class="text-muted">Enter your email to receive a reset link</p>
            </div>
            
            <form action="{{ url_for('recovery.forgot_password') }}" method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                
                <div class="form-floating mb-4">
                    <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
                    <label for="email"><i class="bi bi-envelope me-2"></i>Email Address</label>
                </div>
                
                <button type="submit" class="btn btn-warning w-100 py-3 fw-bold shadow-sm mb-3 text-white">
                    Send Reset Link
                </button>
            </form>
            
            <div class="text-center mt-4">
                <a href="{{ url_for('home') }}" class="text-decoration-none text-secondary"><i class="bi bi-arrow-left me-1"></i>Back to Home</a>
            </div>
        </div>
    </div>
</div>
</div>
{% endblock %}
