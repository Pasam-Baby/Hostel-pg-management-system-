{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
  <h2>Edit Notice</h2>
  <form method="post">
    <div class="mb-3">
      <label class="form-label">Title</label>
      <input type="text" name="title" class="form-control" value="{{ notice['title'] }}" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Message</label>
      <textarea name="message" class="form-control" rows="6" required>{{ notice['message'] }}</textarea>
    </div>
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{{ url_for('notice.notice_board') }}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
