{% extends 'base.html' %}
{% block title %}Admin Settings | HostelApp{% endblock %}
{% block header %}Settings{% endblock %}

{% block content %}
<div class="card shadow-sm border-0 glass-card">
    <div class="card-body">
        <form method="POST" action="{{ url_for('admin.settings') }}">
            <div class="mb-3">
                <label class="form-label">Emergency Contact Number</label>
                <input name="emergency_number" class="form-control" value="{{ emergency_number }}">
            </div>
            <button class="btn btn-primary">Save</button>
        </form>
    </div>
</div>
{% endblock %}
