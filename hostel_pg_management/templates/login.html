{% extends 'base.html' %}
{% block title %}Admin Dashboard | HostelApp{% endblock %}
{% block header %}Secure Login{% endblock %}
{% block content %}
<div class="bg-dashboard min-vh-100 d-flex flex-column justify-content-center" style="margin: -1.5rem;">
    <div class="login-container mt-0 mb-5">
        <div class="card shadow-lg border-0 rounded-4 glass-card float-animation" style="animation-duration: 6s;">
            <div class="card-body p-5">
            <div class="text-center mb-4">
                <div class="bg-primary bg-opacity-10 rounded-circle d-inline-block p-4 mb-3">
                    <i class="bi bi-shield-lock text-primary" style="font-size: 3rem;"></i>
                </div>
                <h3 class="fw-bold">Admin Portal</h3>
                <p class="text-muted">Sign in to manage the hostel</p>
            </div>
            
            <form action="{{ url_for('auth.admin_login') }}" method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="username" name="username" placeholder="Username" required>
                    <label for="username"><i class="bi bi-person me-2"></i>Username</label>
                </div>
                
                <div class="form-floating mb-4">
                    <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
                    <label for="password"><i class="bi bi-key me-2"></i>Password</label>
                </div>
                
                <button type="submit" class="btn btn-primary w-100 py-3 fw-bold shadow-sm mb-3">
                    <i class="bi bi-box-arrow-in-right me-2"></i> Login
                </button>
                <div class="text-end mb-3">
                    <a href="{{ url_for('recovery.forgot_password') }}" class="text-decoration-none small">Forgot Password?</a>
                </div>
                
            </form>
            
            <div class="text-center mt-4">
                <a href="{{ url_for('home') }}" class="text-decoration-none text-secondary"><i class="bi bi-arrow-left me-1"></i>Back to Home</a>
            </div>
        </div>
    </div>
</div>
</div>
{% endblock %}
