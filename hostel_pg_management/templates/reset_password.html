{% extends 'base.html' %}
{% block title %}Reset Password | HostelApp{% endblock %}
{% block header %}Set New Password{% endblock %}
{% block content %}
<div class="bg-dashboard min-vh-100 d-flex flex-column justify-content-center" style="margin: -1.5rem;">
    <div class="login-container mt-0 mb-5">
        <div class="card shadow-lg border-0 rounded-4 glass-card float-animation">
            <div class="card-body p-5">
            <div class="text-center mb-4">
                <div class="bg-info bg-opacity-10 rounded-circle d-inline-block p-4 mb-3">
                    <i class="bi bi-key text-info" style="font-size: 3rem;"></i>
                </div>
                <h3 class="fw-bold">Reset Password</h3>
                <p class="text-muted">Enter your new password below</p>
            </div>
            
            <form action="{{ request.url }}" method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                
                <div class="form-floating mb-4">
                    <input type="password" class="form-control" id="password" name="password" placeholder="New Password" required minlength="6">
                    <label for="password"><i class="bi bi-lock me-2"></i>New Password</label>
                </div>
                
                <button type="submit" class="btn btn-info text-white w-100 py-3 fw-bold shadow-sm mb-3">
                    Update Password
                </button>
            </form>
            
        </div>
    </div>
</div>
</div>
{% endblock %}
